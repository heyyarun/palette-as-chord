<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#c5c8c2" />
    <meta name="description" content="Hear Sanzo Wada's 1933 Haishoku Sōkan colour combinations as musical chords." />
    <title>Palette as Chord</title>
    <script>
      // Apply the saved theme before first paint (kept in sync by src/theme.ts).
      try {
        var p = localStorage.getItem('palette-chord:theme')
        var night = p === 'night' || (p !== 'paper' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = night ? 'night' : 'paper'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
